apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls164
        ports:
        - containerPort: 9696
        env:
        - name: PUID
          value: "3007"
        - name: PGID
          value: "568"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: prowlarr-config
          mountPath: /config
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
      volumes:
      - name: prowlarr-config
        persistentVolumeClaim:
          claimName: prowlarr-config-pvc
