apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  suspend: false
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: plane-ce
      version: "1.8.5"
      sourceRef:
        kind: HelmRepository
        name: plane
        namespace: plane
  valuesFrom:
    - kind: Secret
      name: plane-secret
      valuesKey: SECRET_KEY
      targetPath: env.secret_key
    - kind: Secret
      name: plane-secret
      valuesKey: LIVE_SERVER_SECRET_KEY
      targetPath: env.live_server_secret_key
    - kind: Secret
      name: plane-secret
      valuesKey: DATABASE_URL
      targetPath: env.pgdb_remote_url
  values:
    ingress:
      enabled: true
      appHost: plane.wc
      ingressClass: traefik
      traefik:
        entryPoints:
          - websecure
    ssl:
      tls_secret_name: plane-tls
      externalTermination: false
    postgres:
      local_setup: false
    redis:
      local_setup: true
      storageClass: local-path
      volumeSize: 1Gi
    rabbitmq:
      local_setup: true
      storageClass: local-path
      volumeSize: 100Mi
    minio:
      local_setup: true
      storageClass: local-path
      volumeSize: 10Gi
    worker:
      memoryLimit: 2Gi
      memoryRequest: 500Mi
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: plane-https-redirect
          namespace: plane
        spec:
          redirectScheme:
            scheme: https
            permanent: true
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: plane-http-redirect
          namespace: plane
        spec:
          entryPoints:
            - web
          routes:
            - match: Host(`plane.wc`)
              kind: Rule
              middlewares:
                - name: plane-https-redirect
              services:
                - name: plane-web
                  port: 3000
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: plane-godmode-slash
          namespace: plane
        spec:
          redirectRegex:
            regex: "^https://plane\\.wc/god-mode$"
            replacement: "https://plane.wc/god-mode/"
            permanent: true
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: plane-godmode-slash-redirect
          namespace: plane
        spec:
          entryPoints:
            - websecure
          routes:
            - match: Host(`plane.wc`) && Path(`/god-mode`)
              kind: Rule
              middlewares:
                - name: plane-godmode-slash
              services:
                - name: plane-admin
                  port: 3000
          tls:
            secretName: plane-tls
