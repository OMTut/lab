apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-downloads-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.144
    path: /mnt/datatank/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-downloads-pvc
  namespace: arr
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  volumeName: arr-downloads-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-media-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.144
    path: /mnt/datatank/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-media-pvc
  namespace: arr
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: arr-media-pv
