apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:1.5.1
        ports:
        - containerPort: 6767
        env:
        - name: PUID
          value: "3009"
        - name: PGID
          value: "568"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: bazarr-config
          mountPath: /config
        - name: arr-media
          mountPath: /media
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "128Mi"
      volumes:
      - name: bazarr-config
        persistentVolumeClaim:
          claimName: bazarr-config-pvc
      - name: arr-media
        persistentVolumeClaim:
          claimName: arr-media-pvc
