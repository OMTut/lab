apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: arr
spec:
  entryPoints:
    - websecure
  tls:
    secretName: jellyseerr-tls
  routes:
    - match: Host(`jellyseerr.wc`)
      kind: Rule
      services:
        - name: jellyseerr-service
          port: 5055
