apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      containers:
      - name: jellyseerr
        image: ghcr.io/seerr-team/seerr:latest
        ports:
        - containerPort: 5055
        env:
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: jellyseerr-config
          mountPath: /app/config
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
      volumes:
      - name: jellyseerr-config
        persistentVolumeClaim:
          claimName: jellyseerr-config-pvc
