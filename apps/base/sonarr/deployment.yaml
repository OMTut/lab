apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
        ports:
        - containerPort: 8989
        env:
        - name: PUID
          value: "3006"
        - name: PGID
          value: "568"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: arr-media
          mountPath: /media
        - name: arr-downloads
          mountPath: /downloads
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
      volumes:
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: sonarr-config-pvc
      - name: arr-media
        persistentVolumeClaim:
          claimName: arr-media-pvc
      - name: arr-downloads
        persistentVolumeClaim:
          claimName: arr-downloads-pvc
