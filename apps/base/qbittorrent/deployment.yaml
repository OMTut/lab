apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "custom"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: gluetun-secret
              key: WIREGUARD_PRIVATE_KEY
        - name: WIREGUARD_PUBLIC_KEY
          value: "c3TmpWQpDWDSECuw2fL559wdnQG4NOOaMSBcZVjutG4="
        - name: ENDPOINT
          value: "79.127.183.235:51820"
        - name: WIREGUARD_ADDRESSES
          value: "10.2.0.2/32"
        - name: TZ
          value: "America/Chicago"
        - name: DNS_PLAINTEXT_ADDRESS
          value: "10.2.0.1"
        - name: WIREGUARD_MTU
          value: "1280"
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - "until ip rule show | grep -q '^100:'; do sleep 1; done; ip rule del priority 100; true"
        volumeMounts:
        - name: tun-device
          mountPath: /dev/net/tun
        resources:
          limits:
            memory: "256Mi"
          requests:
            memory: "128Mi"
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls484
        ports:
        - containerPort: 8080
        env:
        - name: PUID
          value: "3008"
        - name: PGID
          value: "568"
        - name: TZ
          value: "America/Chicago"
        - name: WEBUI_PORT
          value: "8080"
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: arr-downloads
          mountPath: /downloads
        resources:
          limits:
            memory: "1Gi"
          requests:
            memory: "256Mi"
      volumes:
      - name: tun-device
        hostPath:
          path: /dev/net/tun
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config-pvc
      - name: arr-downloads
        persistentVolumeClaim:
          claimName: arr-downloads-pvc
